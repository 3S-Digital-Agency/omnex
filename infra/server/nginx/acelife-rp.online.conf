# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name acelife-rp.online www.acelife-rp.online;
    return 301 https://acelife-rp.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acelife-rp.online www.acelife-rp.online;

    ssl_certificate     /etc/letsencrypt/live/acelife-rp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acelife-rp.online/privkey.pem;

    # Site vitrine / Tebex : réconcilier la racine ou le proxy.
    root /opt/acelife/www;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # txAdmin : réconcilier le port interne réel (placeholder).
