# ⚠️ TEMPLATE — NON AUTORITAIRE. Fichier réel : /etc/nginx/sites-available/omnex.cloud.
# À RÉCONCILIER (chemins des certificats Let's Encrypt, socket PHP-FPM, headers CSP).
#
# Routage (docs/infrastructure-map.md §6) :
#   /          → React build  /opt/omnex/frontend/dist
#   /api/*     → Laravel      /opt/omnex/backend/public → PHP-FPM
#   /storage/* → Laravel public storage

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name omnex.cloud www.omnex.cloud;
    return 301 https://omnex.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name omnex.cloud www.omnex.cloud;

    # TLS (réconcilier avec certbot)
    ssl_certificate     /etc/letsencrypt/live/omnex.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnex.cloud/privkey.pem;

    root /opt/omnex/frontend/dist;
    index index.html;

    # www → apex
    if ($host = www.omnex.cloud) {
        return 301 https://omnex.cloud$request_uri;
    }

    # API → Laravel (PHP-FPM socket unix)
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /storage/ {
        alias /opt/omnex/backend/public/storage/;
    }

    # SPA : tout le reste → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /opt/omnex/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_index index.php;
    }

    # Réconcilier : gzip/brotli, cache assets, headers de sécurité (CSP, HSTS…).
}
