services:
  postgres:
    image: postgres:16-alpine
    container_name: omnex-postgres
    environment:
      POSTGRES_DB: omnex
      POSTGRES_USER: omnex
      POSTGRES_PASSWORD: omnex
    ports:
      - "5432:5432"
    volumes:
      - omnex_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnex -d omnex"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: omnex-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - omnex_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  omnex_pg:
  omnex_redis:
