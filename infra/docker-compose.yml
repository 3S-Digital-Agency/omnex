services:
  postgres:
    image: postgres:16-alpine
    container_name: omnex-postgres
    restart: unless-stopped
    # Limites de ressources — VPS partagé avec ACELIFE (FiveM est sensible au
    # CPU). À ajuster selon l'usage réel (docs/infrastructure-map.md §12).
    cpus: '2.0'
    mem_limit: 2g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    environment:
      POSTGRES_DB: omnex
      POSTGRES_USER: omnex
      POSTGRES_PASSWORD: omnex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - omnex_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnex -d omnex"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: omnex-redis
    restart: unless-stopped
    # Cache/queue/session/streams : mono-thread, petit en mémoire.
    cpus: '0.5'
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - omnex_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  omnex_pg:
  omnex_redis:
