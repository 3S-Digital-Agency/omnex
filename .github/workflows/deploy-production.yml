name: Deploy OMNEX Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      - '*.md'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnex-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy omnex.cloud
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OMNEX_DEPLOY_KEY }}
          ADMIN_DEPLOY_KEY: ${{ secrets.OMNEX_ADMIN_KEY }}
          KNOWN_HOSTS: ${{ secrets.OMNEX_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/omnex-deploy
          chmod 600 ~/.ssh/omnex-deploy

          if [[ -n "$ADMIN_DEPLOY_KEY" ]]; then
            printf '%s\n' "$ADMIN_DEPLOY_KEY" > ~/.ssh/omnex-admin
            chmod 600 ~/.ssh/omnex-admin
          fi

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to OVH
        run: |
          ssh \
            -i ~/.ssh/omnex-deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy@${{ secrets.OMNEX_HOST }}

      - name: Fix frontend ownership + route cache
        if: always()
        env:
          ADMIN_DEPLOY_KEY: ${{ secrets.OMNEX_ADMIN_KEY }}
        run: |
          # Compte admin-deploy (sans forced command) : permis pour chown/chmod
          # sur frontend/dist + reload nginx/php-fpm. Sinon, le compte deploy
          # (forced command) exécute le script omnex-fix-perms.sh embarqué.
          if [[ -n "$ADMIN_DEPLOY_KEY" ]]; then
            ssh \
              -i ~/.ssh/omnex-admin \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              admin-deploy@${{ secrets.OMNEX_HOST }} \
              'sudo chown -R admin:www-data /opt/omnex/frontend/dist && sudo find /opt/omnex/frontend/dist -type d -exec chmod 755 {} \; && sudo find /opt/omnex/frontend/dist -type f -exec chmod 644 {} \; && sudo systemctl reload nginx php8.2-fpm && echo "Fix applied (admin-deploy)"'
          else
            ssh \
              -i ~/.ssh/omnex-deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              deploy@${{ secrets.OMNEX_HOST }} \
              'bash /opt/omnex/infra/server/scripts/omnex-fix-perms.sh && echo "Fix applied (deploy)"'
          fi

      - name: Verify production
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            https://omnex.cloud/ \
            >/dev/null

          echo "OMNEX production healthy"
