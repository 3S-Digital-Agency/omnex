name: Deploy OMNEX Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      - '*.md'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnex-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy omnex.cloud
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OMNEX_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.OMNEX_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/omnex-deploy
          chmod 600 ~/.ssh/omnex-deploy

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to OVH
        run: |
          ssh \
            -i ~/.ssh/omnex-deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy@${{ secrets.OMNEX_HOST }}

      - name: Fix frontend ownership + route cache
        run: |
          ssh \
            -i ~/.ssh/omnex-deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            admin@${{ secrets.OMNEX_HOST }} \
            'sudo chown -R admin:www-data /opt/omnex/frontend/dist && sudo find /opt/omnex/frontend/dist -type d -exec chmod 755 {} \; && sudo find /opt/omnex/frontend/dist -type f -exec chmod 644 {} \; && cd /opt/omnex/backend && php artisan route:cache 2>/dev/null || true && sudo systemctl reload nginx php8.2-fpm && echo "Fix applied"'

      - name: Verify production
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            https://omnex.cloud/ \
            >/dev/null

          echo "OMNEX production healthy"
