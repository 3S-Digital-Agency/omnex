name: Monitoring — production health

# Phase 10 monitoring: probes the production /api/v1/health endpoint every
# 15 minutes. On repeated failure it opens an incident issue; on recovery it
# closes it automatically. Requires the PRODUCTION_HEALTH_URL secret
# (e.g. https://app.omnex.cloud/api/v1/health).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  probe:
    name: Probe production health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe endpoint
        id: probe
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "${{ secrets.PRODUCTION_HEALTH_URL }}" || true)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "✅ Production healthy"
          else
            echo "::error::Production health probe failed with HTTP $code"
          fi

      - name: Open incident issue on failure
        if: steps.probe.outputs.code != '200'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'incident';
            const title = `🚨 Incident — production health check failed (HTTP ${process.env.PROBE_CODE})`;
            const body = `The production health probe returned HTTP ${process.env.PROBE_CODE} at ${new Date().toISOString()}.\n\nSee the [Deploy workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions) for the latest deployment status.`;
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' });
            } catch {}
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: [label],
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: [label],
              });
              console.log('🚨 Incident issue opened');
            } else {
              console.log('⚠️ Incident already open — skipping duplicate');
            }
        env:
          PROBE_CODE: ${{ steps.probe.outputs.code }}

      - name: Close incident on recovery
        if: steps.probe.outputs.code == '200'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'incident';
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: [label],
            });
            for (const issue of open.data) {
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`✅ Incident #${issue.number} closed — production is healthy`);
            }
