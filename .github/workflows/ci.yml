name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dco:
    name: DCO — commits Signed-off-by
    # Dependabot commits are authored by GitHub's verified bot and cannot be
    # signed off individually — skip DCO for automated dependency PRs.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format='%H' origin/main..HEAD)
          else
            COMMITS=$(git log --format='%H' -1)
          fi
          for c in $COMMITS; do
            if ! git log -1 --format='%(trailers:key=Signed-off-by)' "$c" | grep -q 'Signed-off-by:'; then
              echo "::error::Commit $c is missing Signed-off-by (DCO). Run: git rebase --signoff"
              exit 1
            fi
          done
          echo "DCO OK — all commits are signed."
  backend:
    name: Backend — Pest (PHP 8.3 / PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnex
          POSTGRES_PASSWORD: omnex
          POSTGRES_DB: omnex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnex -d omnex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: omnex_test
      DB_USERNAME: omnex
      DB_PASSWORD: omnex

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, dom, fileinfo, openssl, pdo, pgsql, tokenizer, simplexml, ctype, intl, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction --force

      - name: Run Pest
        working-directory: backend
        run: php artisan test

  frontend:
    name: Frontend — typecheck + vitest (Node 20 / pnpm 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Run vitest
        working-directory: frontend
        run: pnpm test
