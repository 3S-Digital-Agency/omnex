name: Deploy — OMNEX CI/CD pipeline

# Phase 10 (OMNEX Deploy): build → test → security scan (in ci.yml) →
# staging → health check → production → monitoring. Automatic rollback to
# the previous release whenever a health check fails.
#
# Triggered on pushes to main (after CI passes) or manually with workflow_dispatch.
# The actual SSH/registry credentials are supplied by repository secrets:
#   DOCKER_REGISTRY, DOCKER_USERNAME, DOCKER_PASSWORD
#   STAGING_HOST, STAGING_USER, STAGING_SSH_KEY
#   PRODUCTION_HOST, PRODUCTION_USER, PRODUCTION_SSH_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  IMAGE_BACKEND: ${{ secrets.DOCKER_REGISTRY }}/omnex-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_REGISTRY }}/omnex-frontend
  TAG: ${{ github.sha }}

jobs:
  deploy-staging:
    name: Build images → deploy staging → health check
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      tag: ${{ env.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ env.TAG }},${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ env.TAG }},${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/omnex
            export IMAGE_BACKEND=${{ env.IMAGE_BACKEND }} IMAGE_FRONTEND=${{ env.IMAGE_FRONTEND }} TAG=${{ env.TAG }}
            docker compose pull backend frontend
            docker compose up -d --no-deps backend frontend
            docker image prune -f

      - name: Health check — staging
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ secrets.STAGING_HOST }}/api/v1/health" || true)
            if [ "$code" = "200" ]; then
              echo "✅ Staging healthy after ${i} attempts"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging health check failed (last code: $code)"
          exit 1

  promote-production:
    name: Promote to production → health check → rollback on failure
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd /opt/omnex
            export IMAGE_BACKEND=${{ env.IMAGE_BACKEND }} IMAGE_FRONTEND=${{ env.IMAGE_FRONTEND }} TAG=${{ needs.deploy-staging.outputs.tag }}
            # Tag the current running release for rollback
            docker tag ${{ env.IMAGE_BACKEND }}:latest ${{ env.IMAGE_BACKEND }}:previous || true
            docker tag ${{ env.IMAGE_FRONTEND }}:latest ${{ env.IMAGE_FRONTEND }}:previous || true
            docker compose pull backend frontend
            docker compose up -d --no-deps backend frontend

      - name: Health check — production
        id: health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ secrets.PRODUCTION_HOST }}/api/v1/health" || true)
            if [ "$code" = "200" ]; then
              echo "✅ Production healthy after ${i} attempts"
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production health check failed (last code: $code) — rolling back"
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Automatic rollback
        if: steps.health.outputs.healthy == 'false'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd /opt/omnex
            export IMAGE_BACKEND=${{ env.IMAGE_BACKEND }} IMAGE_FRONTEND=${{ env.IMAGE_FRONTEND }}
            docker tag ${{ env.IMAGE_BACKEND }}:previous ${{ env.IMAGE_BACKEND }}:latest
            docker tag ${{ env.IMAGE_FRONTEND }}:previous ${{ env.IMAGE_FRONTEND }}:latest
            docker compose up -d --no-deps backend frontend
            echo "⏪ Rolled back to previous release"
